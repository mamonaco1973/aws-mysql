 H1025" fill="none" stroke="#137e77" stroke-width="2" marker-end="url(#a_e_rd)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#137e77" stroke="#ffffff" stroke-width="6" paint-order="stroke">read</text><path d="M460,695.0 H595" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_sql_r)"/><text x="530.0" y="683.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">MySQL :3306</text><path d="M1020,695.0 H1155" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_async)"/><text x="1090.0" y="683.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">async copy</text><path d="M810.0,750 V835" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_sync)"/><text x="824.0" y="801.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">sync mirror</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Browser</text><text x="104.0" y="117.0" font-fa